# One-click deploy: https://render.com/deploy?repo=<this repo's URL>
services:
  - type: web
    name: ai-research-os
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      # Postgres connection string (e.g. a free Neon database). Without it, accounts live on Render's
      # throwaway disk and are wiped on every redeploy.
      - key: DATABASE_URL
        sync: false
      # Free AI for signed-in users without their own key. A free Gemini key: https://aistudio.google.com/apikey
      - key: FREE_AI_KEY
        sync: false
      - key: FREE_AI_PROVIDER
        value: gemini
      - key: FREE_AI_DAILY
        value: "25"
      # Optional: password-reset emails through https://resend.com (free tier).
      - key: RESEND_API_KEY
        sync: false
